; hive-monitor: per-hive ESP32 sensor node
; Contract with the server: docs/research/telemetry-schema.md

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DFW_VERSION=\"0.1.0\"
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bogde/HX711 @ ^0.7.5                    ; load cell amplifier
    milesburton/DallasTemperature @ ^3.11.0 ; DS18B20 brood / HX711 comp probes
    paulstoffregen/OneWire @ ^2.3.8
    adafruit/Adafruit SHT31 Library @ ^2.2.2
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8           ; MQTT
    bblanchon/ArduinoJson @ ^7.0.4
    kosme/arduinoFFT @ ^2.0.2               ; sound band energies

[env:hive-a]
build_flags = ${env.build_flags} -DHIVE_ID=\"hive-a\"

[env:hive-b]
build_flags = ${env.build_flags} -DHIVE_ID=\"hive-b\"

; Heater experiment build (see docs/research/hive-heating.md). Node stays
; awake; requires the hardware thermal cutoff to be wired in series.
[env:hive-a-heater]
build_flags = ${env.build_flags} -DHIVE_ID=\"hive-a\" -DHEATER_ENABLED=1
