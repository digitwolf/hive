# MQTT -> InfluxDB 2. Schema: docs/research/telemetry-schema.md
[agent]
  interval = "10s"
  flush_interval = "10s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["hive/+/+"]
  qos = 1
  data_format = "json"
  # "ts" is UTC epoch seconds from the node; 0 (unsynced) falls back to receive time.
  json_time_key = "ts"
  json_time_format = "unix"
  json_string_fields = ["fw", "reason", "type"]

  # hive/<hive_id>/<metric>  ->  measurement = metric, tag hive_id
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "hive/+/+"
    measurement = "_/_/measurement"
    tags = "_/hive_id/_"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "hive"
